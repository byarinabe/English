<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Detective: Present Simple vs Present Continuous</title><style>:root{--accent:#5479b8}
*{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(135deg,#f8f4fb,#f1f4ff);font:16px/1.5 system-ui,sans-serif;color:#29253a}
main{max-width:820px;margin:auto}header{padding:16px 0}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.12;margin:7px 0}.sub,.hint,.small{color:#716c80}
.panel{background:white;border:1px solid #e8e1f0;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #29204a0b}
.top,.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.badge{background:#f1ecf8;color:var(--accent);padding:7px 12px;border-radius:30px;font-weight:700}
.progress{height:9px;background:#eee9f3;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;background:var(--accent);width:0}
.prompt{font-size:1.25rem;font-weight:750;margin:18px 0 8px}.answers{display:grid;gap:10px;margin-top:16px}
.choice{padding:13px 15px;border:1.5px solid #e8e1f0;border-radius:13px;background:#fff;text-align:left;color:#29253a;font:inherit;min-height:48px;cursor:pointer}
.choice:hover{border-color:var(--accent);background:#fbf9ff}.choice:disabled{opacity:1}.choice.correct{border-color:#29966a;background:#effaf4}.choice.wrong{border-color:#d45b71;background:#fff2f4}
.feedback{display:none;margin-top:14px;padding:12px;border-radius:12px}.feedback.show{display:block}.good{background:#effaf4;color:#176343}.bad{background:#fff2f4;color:#8e3045}
button:focus-visible{outline:3px solid #b7a2e6;outline-offset:2px}.primary,.secondary{border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#f0edf5;color:#29253a}
.result{text-align:center;padding:20px}.scorebig{font-size:2.6rem;font-weight:850;color:var(--accent)}
@media(max-width:520px){body{padding:12px}.panel{padding:16px}}
</style></head><body><main><header><div class="eyebrow">English practice · Interactive game</div><h1>Grammar Detective: Present Simple vs Present Continuous</h1><p class="sub">28 questions covering habits, actions now, temporary situations and stative verbs.</p></header><section class="panel"><div class="top"><span class="badge" id="badge">Round</span><span class="badge" id="score">Score: 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="count"></div><div class="prompt" id="prompt"></div><p class="hint" id="hint"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="next" type="button" disabled>Next question →</button><button class="secondary" id="restart" type="button">Restart</button></div></section></main><script>
const data=[["I usually ___ my friends after classes.", ["meet", "am meeting", "meeting"], 0, "usually = привычка → Present Simple."], ["Be quiet! The baby ___.", ["sleeps", "is sleeping", "sleep"], 1, "Be quiet! показывает, что действие происходит сейчас → Present Continuous."], ["She ___ horror films.", ["doesn't like", "isn't liking", "don't like"], 0, "like — stative verb; обычно используется в Present Simple."], ["I ___ with my aunt this month.", ["stay", "am staying", "stays"], 1, "this month — временная ситуация → Present Continuous."], ["We ___ English classes twice a week.", ["are having", "has", "have"], 2, "twice a week — регулярность → Present Simple."], ["What ___ you ___ at the moment?", ["do / do", "are / doing", "does / do"], 1, "at the moment → Present Continuous."], ["My best friend ___ in Moscow.", ["is living", "lives", "live"], 1, "Постоянное место жительства → Present Simple."], ["They ___ a new hobby these days.", ["try", "tries", "are trying"], 2, "these days — временная активность."], ["I ___ the answer.", ["am knowing", "know", "knowing"], 1, "know — stative verb, обычно не используется в Continuous."], ["He ___ a new laptop.", ["is wanting", "wants", "want"], 1, "want — stative verb → Present Simple."], ["This bag ___ to my sister.", ["is belonging", "belongs", "belong"], 1, "belong — stative verb → Present Simple."], ["I ___ about changing my course right now.", ["think", "am thinking", "thinks"], 1, "think about = обдумывать; активный процесс допускает Continuous."], ["My friends never ___ late.", ["are arriving", "arrive", "arrives"], 1, "never — маркер привычки → Present Simple."], ["Look! It ___.", ["rains", "is raining", "rain"], 1, "Look! указывает на происходящее сейчас."], ["___ your sister usually ___ video games?", ["Does / play", "Is / playing", "Do / plays"], 0, "usually → Present Simple; does + subject + V1."], ["Why ___ you ___ at me now?", ["do / look", "are / looking", "does / look"], 1, "now → Present Continuous."], ["I ___ coffee, but I ___ tea today.", ["usually drink / am drinking", "am usually drinking / drink", "drink / drink"], 0, "usually drink — привычка; am drinking today — временная ситуация."], ["She ___ Spanish, but this week she ___ English.", ["studies / is practising", "is studying / practises", "study / is practise"], 0, "Факт/обычная деятельность + временное действие."], ["We ___ what you mean.", ["aren't understanding", "don't understand", "doesn't understand"], 1, "understand — stative verb → Present Simple."], ["More students ___ online courses these days.", ["take", "takes", "are taking"], 2, "these days — меняющаяся тенденция."], ["He ___ his grandparents every Sunday.", ["is visiting", "visit", "visits"], 2, "every Sunday → Present Simple; he + -s."], ["I ___ this song. It's amazing!", ["love", "am loving", "loves"], 0, "love — stative verb, обычно Present Simple."], ["They ___ with their cousins this week.", ["stay", "are staying", "stays"], 1, "this week — временная ситуация."], ["___ you ___ this question?", ["Are / understanding", "Do / understand", "Does / understand"], 1, "understand — stative verb; Present Simple."], ["My brother ___ to the gym on Mondays.", ["goes", "is going", "go"], 0, "on Mondays — регулярное действие."], ["At the moment, we ___ for our exams.", ["prepare", "prepares", "are preparing"], 2, "at the moment → Present Continuous."], ["This phone ___ to Anna.", ["is belonging", "belong", "belongs"], 2, "belong — stative verb."], ["I ___ what to do. Can you help me?", ["don't know", "am not knowing", "doesn't know"], 0, "know — stative verb; I don't know."]];const groups=[{n:'Mission 1 · Habits or now?',a:0,b:7},{n:'Mission 2 · Temporary situations',a:7,b:14},{n:'Mission 3 · Stative verbs',a:14,b:21},{n:'Mission 4 · Mixed investigation',a:21,b:28}];
let qs=[],i=0,score=0,locked=false;const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){qs=shuffle(data.map((q,n)=>({q,n})));i=0;score=0;show()}
function show(){
 if(i>=qs.length)return finish();locked=false;let item=qs[i],q=item.q;let group=Math.floor(item.n/7);$('badge').textContent=groups[group].n;$('score').textContent='Score: '+score+'/'+qs.length;$('count').textContent='Question '+(i+1)+' of '+qs.length;$('bar').style.width=(i/qs.length*100)+'%';$('prompt').textContent=q[0];$('hint').textContent='Choose the grammatically correct option.';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('answers').innerHTML='';
 shuffle(q[1].map((v,n)=>({v,n})).map(x=>x)).forEach(x=>{let b=document.createElement('button');b.className='choice';b.type='button';b.textContent=x.v;b.onclick=()=>check(b,x.n,q);$('answers').appendChild(b)})
}
function check(btn,n,q){if(locked)return;locked=true;let ok=n===q[2];[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===q[1][q[2]])b.classList.add('correct')});if(ok)score++;else btn.classList.add('wrong');$('score').textContent='Score: '+score+'/'+qs.length;$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').textContent=(ok?'Correct! ':'Check the rule. ')+q[3];$('next').disabled=false}
function finish(){$('bar').style.width='100%';$('badge').textContent='Case closed';$('count').textContent='All grammar missions completed';$('prompt').textContent='Grammar detective complete!';$('hint').textContent='';$('answers').innerHTML='<div class="result"><div class="scorebig">'+score+' / '+qs.length+'</div><p>'+(score>=24?'Excellent! You solved almost every case.':score>=17?'Good work. Review the explanations you found tricky.':'Keep investigating: focus on time markers and stative verbs.')+'</p></div>';$('feedback').className='feedback';$('next').disabled=true}
$('next').onclick=()=>{i++;show()};$('restart').onclick=start;start();
</script></body></html>
