<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Quest: Friends & Hobbies</title><style>:root{--accent:#8063b7}
*{box-sizing:border-box}body{margin:0;padding:20px;background:linear-gradient(135deg,#f8f4fb,#f1f4ff);font:16px/1.5 system-ui,sans-serif;color:#29253a}
main{max-width:820px;margin:auto}header{padding:16px 0}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.12;margin:7px 0}.sub,.hint,.small{color:#716c80}
.panel{background:white;border:1px solid #e8e1f0;border-radius:20px;padding:22px;margin:14px 0;box-shadow:0 8px 24px #29204a0b}
.top,.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.badge{background:#f1ecf8;color:var(--accent);padding:7px 12px;border-radius:30px;font-weight:700}
.progress{height:9px;background:#eee9f3;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;background:var(--accent);width:0}
.prompt{font-size:1.25rem;font-weight:750;margin:18px 0 8px}.answers{display:grid;gap:10px;margin-top:16px}
.choice{padding:13px 15px;border:1.5px solid #e8e1f0;border-radius:13px;background:#fff;text-align:left;color:#29253a;font:inherit;min-height:48px;cursor:pointer}
.choice:hover{border-color:var(--accent);background:#fbf9ff}.choice:disabled{opacity:1}.choice.correct{border-color:#29966a;background:#effaf4}.choice.wrong{border-color:#d45b71;background:#fff2f4}
.feedback{display:none;margin-top:14px;padding:12px;border-radius:12px}.feedback.show{display:block}.good{background:#effaf4;color:#176343}.bad{background:#fff2f4;color:#8e3045}
button:focus-visible{outline:3px solid #b7a2e6;outline-offset:2px}.primary,.secondary{border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#f0edf5;color:#29253a}
.result{text-align:center;padding:20px}.scorebig{font-size:2.6rem;font-weight:850;color:var(--accent)}
@media(max-width:520px){body{padding:12px}.panel{padding:16px}}
</style></head><body><main><header><div class="eyebrow">English practice · Interactive game</div><h1>Vocabulary Quest: Friends & Hobbies</h1><p class="sub">24 questions to learn hobbies, collocations and expressions about friends.</p></header><section class="panel"><div class="top"><span class="badge" id="badge">Round</span><span class="badge" id="score">Score: 0</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="small" id="count"></div><div class="prompt" id="prompt"></div><p class="hint" id="hint"></p><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="next" type="button" disabled>Next question →</button><button class="secondary" id="restart" type="button">Restart</button></div></section></main><script>
const data=[["read books", "читать книги", "You do this with a novel.", ["читать книги", "смотреть фильмы", "слушать музыку"], 0], ["watch films", "смотреть фильмы", "You can do this at home or at the cinema.", ["играть в игры", "смотреть фильмы", "рисовать"], 1], ["listen to music", "слушать музыку", "You can do this with headphones.", ["слушать музыку", "готовить", "танцевать"], 0], ["play video games", "играть в видеоигры", "You do this on a console or computer.", ["играть в видеоигры", "гулять", "фотографировать"], 0], ["take photos", "фотографировать", "You use a camera or phone.", ["рисовать", "фотографировать", "печь"], 1], ["go for a walk", "гулять", "You do this outside, often in a park.", ["гулять", "ходить по магазинам", "читать"], 0], ["be interested in", "интересоваться", "I'm ___ art and photography.", ["be good at", "be interested in", "keep in touch"], 1], ["be good at", "хорошо уметь", "She's ___ dancing.", ["good at", "keen on", "interested in"], 0], ["be keen on", "увлекаться", "He's ___ playing the guitar.", ["keen on", "good at", "get along with"], 0], ["spend time doing something", "проводить время за чем-либо", "We spend time ___ together.", ["study", "studying", "to study"], 1], ["hang out with friends", "проводить время с друзьями", "A casual phrase for spending time with friends.", ["hang out with friends", "join a club", "keep in touch"], 0], ["meet up with friends", "встречаться с друзьями", "Let's ___ after class.", ["keep in touch", "meet up with friends", "get along"], 1], ["get along with someone", "ладить с кем-либо", "You have a good relationship with this person.", ["get along with someone", "take photos", "go shopping"], 0], ["keep in touch", "поддерживать связь", "We live far away, but we ___.", ["have in common", "keep in touch", "go out"], 1], ["have a lot in common", "иметь много общего", "We both love music. We ___.", ["have a lot in common", "join a club", "try something new"], 0], ["make new friends", "заводить новых друзей", "At university, you can ___.", ["make new friends", "stay at home", "take photos"], 0], ["join a club", "вступить в клуб / кружок", "If you like photography, you can ___.", ["join a club", "keep in touch", "go for a walk"], 0], ["try something new", "пробовать что-то новое", "I want to ___ this year.", ["try something new", "get along", "watch a series"], 0], ["go shopping", "ходить по магазинам", "You do this when you want to buy things.", ["go shopping", "play an instrument", "read books"], 0], ["play a musical instrument", "играть на музыкальном инструменте", "You might play the piano or guitar.", ["play a musical instrument", "take photos", "go out together"], 0], ["go out together", "куда-нибудь ходить вместе", "Friends sometimes ___ at weekends.", ["go out together", "stay in touch", "be good at"], 0], ["relax", "расслабляться", "After a busy day, I just want to ___.", ["relax", "join", "meet"], 0], ["cook / bake", "готовить / печь", "You do this in the kitchen.", ["cook / bake", "draw / paint", "dance"], 0], ["draw / paint", "рисовать", "You use pencils, pens or paint.", ["draw / paint", "go shopping", "listen to music"], 0]];let qs=[],i=0,score=0,locked=false;
const $=x=>document.getElementById(x);const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function start(){qs=shuffle(data);i=0;score=0;show()}
function show(){
 if(i>=qs.length) return finish();
 locked=false;let q=qs[i];$('badge').textContent='Vocabulary Quest';$('score').textContent='Score: '+score+'/'+qs.length;$('count').textContent='Question '+(i+1)+' of '+qs.length;$('bar').style.width=(i/qs.length*100)+'%';$('prompt').textContent=q[2];$('hint').textContent='Choose the correct answer.';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=true;$('answers').innerHTML='';
 let options=shuffle(q[3]);options.forEach((v)=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.type='button';b.onclick=()=>check(b,v,q);$('answers').appendChild(b)})
}
function check(btn,v,q){if(locked)return;locked=true;let right=q[3][q[4]];let ok=v===right;[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===right)b.classList.add('correct')});if(ok)score++;else btn.classList.add('wrong');$('score').textContent='Score: '+score+'/'+qs.length;$('feedback').className='feedback show '+(ok?'good':'bad');$('feedback').textContent=(ok?'Correct! ':'Not quite. ')+q[0]+' — '+q[1]+'.';$('next').disabled=false}
function finish(){$('bar').style.width='100%';$('badge').textContent='Completed';$('count').textContent='All vocabulary questions completed';$('prompt').textContent='Well done!';$('hint').textContent='';$('answers').innerHTML='<div class="result"><div class="scorebig">'+score+' / '+qs.length+'</div><p>'+(score>=20?'Excellent vocabulary!':score>=14?'Great work! Revise a few expressions.':'Good start — play again to remember more words.')+'</p></div>';$('feedback').className='feedback';$('next').disabled=true}
$('next').onclick=()=>{i++;show()};$('restart').onclick=start;start();
</script></body></html>
