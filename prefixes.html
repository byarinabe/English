<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negative Prefixes Game</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--b1:#ffe3f1;--b2:#e9ddff;--card:#fff;--ink:#4a2545;--pink:#ff5fa2;--lil:#a77bff;--ok:#2fbf8f;--bad:#ff5a6e;--soft:#fff0f8;--line:#ffc2de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#2a1030;--b2:#1d1840;--card:#3a2145;--ink:#ffe9f6;--soft:#4a2a58;--line:#7a3b78;color-scheme:dark}}
:root[data-theme="dark"]{--b1:#2a1030;--b2:#1d1840;--card:#3a2145;--ink:#ffe9f6;--soft:#4a2a58;--line:#7a3b78;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--b1),var(--b2));color:var(--ink);font-family:Fredoka,"Trebuchet MS",sans-serif;font-size:17px}
#app{max-width:520px;margin:0 auto;padding:18px 16px 40px;position:relative;z-index:1}
h1{font-family:Pacifico,cursive;color:var(--pink);font-weight:400;font-size:34px;text-align:center;margin:6px 0 0}
.sub{text-align:center;margin:4px 0 14px;opacity:.85}
input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:12px}
button{font:inherit;color:var(--ink);cursor:pointer}
.map{display:grid;gap:10px;margin-bottom:14px}
.lv{display:grid;grid-template-columns:46px 1fr auto;grid-template-areas:"e t s" "e d s";align-items:center;column-gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 var(--line)}
.lv:disabled{opacity:.5;cursor:not-allowed}
.lv .e{grid-area:e;font-size:34px}.lv b{grid-area:t}.lv small{grid-area:d;opacity:.75}.lv .s{grid-area:s;color:#ffb300;letter-spacing:1px}
.big{width:100%;padding:14px;border:0;border-radius:20px;background:linear-gradient(90deg,var(--pink),var(--lil));color:#fff;font-weight:600;font-size:18px;box-shadow:0 4px 0 rgba(120,40,120,.35);margin-top:10px}
.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top button{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 12px}
.bar{flex:1;height:14px;background:var(--card);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lil));transition:width .4s}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px 16px;text-align:center;box-shadow:0 6px 0 var(--line)}
.w{font-size:40px;font-weight:600;margin:6px 0}.w u{color:var(--pink);text-decoration:none;border-bottom:4px dashed var(--pink);padding:0 6px}
.ru{font-size:20px;opacity:.85}
.sp{border:0;background:var(--soft);border-radius:50%;width:44px;height:44px;font-size:20px;margin-top:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opts button{padding:16px 8px;font-size:22px;font-weight:600;border:2px solid var(--line);background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line)}
.opts button.ok,.fb.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.bad,.fb.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 14px;border-radius:18px;text-align:left}
.fb.ok,.fb.bad{box-shadow:none}
.stars{font-size:42px;color:#ffb300;letter-spacing:4px;text-align:center}
.rep{background:var(--card);border:3px dashed var(--pink);border-radius:26px;padding:18px;text-align:center}
.rep table{width:100%;margin:10px 0;border-collapse:collapse}.rep td{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:left}.rep td:last-child{text-align:right;color:#ffb300}
.fl{position:fixed;top:-40px;pointer-events:none;z-index:0;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes flo{0%{transform:translateY(0)}50%{transform:translateY(-14px)}100%{transform:translateY(0)}}
.bg{position:fixed;z-index:0;opacity:.5;pointer-events:none;animation:flo 5s ease-in-out infinite}
</style></head><body><div id="app"></div>
<script>
// Data: [base adjective, prefix, Russian meaning, optional note]
const N={un:"un- — самая частая приставка.",in:"in- — запоминаем слово целиком.",im:"im- ставим перед p и m: impossible, immature.",il:"il- ставим перед l: illegal, illogical.",ir:"ir- ставим перед r: irregular, irresponsible.",dis:"dis- — запоминаем слово целиком."};
const L=[
{t:"Милый un-",e:"🍬",d:"Самая частая приставка",o:["un","in","dis"],q:[["happy","un","несчастный"],["kind","un","недобрый"],["fair","un","несправедливый"],["lucky","un","невезучий"],["usual","un","необычный"],["known","un","неизвестный"],["friendly","un","недружелюбный"],["comfortable","un","неудобный"]]},
{t:"Буква решает",e:"🔤",d:"im- / il- / ir- перед p, m, l, r",o:["un","im","il","ir"],q:[["possible","im","невозможный"],["polite","im","невежливый"],["patient","im","нетерпеливый"],["mature","im","незрелый"],["legal","il","незаконный"],["logical","il","нелогичный"],["regular","ir","неправильный (о глаголе)"],["responsible","ir","безответственный"]]},
{t:"Dis- и in-",e:"💅",d:"Запоминаем слова целиком",o:["un","in","dis","im"],q:[["honest","dis","нечестный"],["loyal","dis","нелояльный"],["satisfied","dis","недовольный","dis- + satisfied: получается две s — dissatisfied!"],["organized","dis","неорганизованный"],["pleased","dis","недовольный"],["active","in","неактивный"],["correct","in","неправильный"],["complete","in","незаконченный"]]},
{t:"Хитрые исключения",e:"🕵️",d:"Где правило не работает",o:["un","in","im","ir"],q:[["real","un","нереальный","Перед r обычно ir-, но unreal — исключение!"],["popular","un","непопулярный","Перед p обычно im-, но unpopular — исключение!"],["pleasant","un","неприятный","Перед p обычно im-, но unpleasant — исключение!"],["reliable","un","ненадёжный","Перед r обычно ir-, но unreliable — исключение!"],["interesting","un","неинтересный","Перед i чаще всего un-: uninteresting."],["aware","un","не осознающий","Перед a бывает и un-, и in-: unaware."],["accurate","in","неточный","Перед a бывает и un-, и in-: inaccurate."],["appropriate","in","неуместный","Перед a бывает и un-, и in-: inappropriate."]]},
{t:"Босс: впиши сама",e:"👑",d:"Напиши слово с приставкой",type:1,q:[["happy","un","несчастный"],["possible","im","невозможный"],["honest","dis","нечестный"],["legal","il","незаконный"],["patient","im","нетерпеливый"],["regular","ir","неправильный (о глаголе)"],["important","un","неважный"],["satisfied","dis","недовольный","dissatisfied — две s!"]]}];
const $=s=>document.getElementById(s),h=s=>$("app").innerHTML=s;
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let S={name:"",st:[0,0,0,0,0]},G={};
try{const d=JSON.parse(localStorage.getItem("npg"));if(d){S.name=d.name||"";S.st=d.st||S.st}}catch(e){}
const save=()=>{try{localStorage.setItem("npg",JSON.stringify(S))}catch(e){}};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function beep(ok){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type="sine";o.frequency.value=ok?660:220;if(ok)o.frequency.setValueAtTime(880,c.currentTime+.1);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.start();o.stop(c.currentTime+.3)}catch(e){}}
function rain(arr,n){for(let i=0;i<n;i++){const s=document.createElement("span");s.className="fl";s.textContent=arr[i%arr.length];s.style.left=Math.random()*100+"vw";s.style.fontSize=18+Math.random()*20+"px";s.style.animationDuration=2+Math.random()*2.5+"s";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),5500)}}
["✨","💖","🎀","🌸","⭐","🦋"].forEach((e,i)=>{const s=document.createElement("span");s.className="bg";s.textContent=e;s.style.left=(8+i*17)+"vw";s.style.top=(10+(i*29)%75)+"vh";s.style.fontSize="26px";s.style.animationDelay=i*.7+"s";document.body.appendChild(s)});

function home(){const tot=S.st.reduce((a,b)=>a+b,0);
h(`<h1>Negative Prefixes</h1><p class="sub">un- · in- · im- · il- · ir- · dis-<br>Учебник, стр. 188–191 🎀</p>
<input id="nm" placeholder="Твоё имя" maxlength="20" value="${S.name}">
<div class="map">${L.map((l,i)=>{const lk=i&&!S.st[i-1];return `<button class="lv" ${lk?"disabled":""} onclick="start(${i})"><span class="e">${lk?"🔒":l.e}</span><b>${i+1}. ${l.t}</b><small>${l.d}</small><span class="s">${"★".repeat(S.st[i])+"☆".repeat(3-S.st[i])}</span></button>`}).join("")}</div>
<button class="big" onclick="report()">🎀 Мой отчёт · ${tot}/15 ★</button>`)}

function start(i){const n=$("nm");if(n){S.name=n.value.trim();save()}
G={l:i,q:shuf(L[i].q.map(x=>({x,r:0}))),n:L[i].q.length,m:0};ask()}

function ask(){if(!G.q.length)return fin();const l=L[G.l],c=G.q[0],[b,p,ru]=c.x;G.a=false;
const body=l.type?`<input id="ans" placeholder="Напиши слово целиком" autocomplete="off" autocapitalize="off" onkeydown="if(event.key==='Enter')chk()"><button class="big" onclick="chk()">Проверить ✨</button><button class="big ghost" onclick="hint()">💡 Подсказка</button>`
:`<div class="opts">${shuf(l.o).map(o=>`<button data-p="${o}" onclick="pick('${o}')">${o}-</button>`).join("")}</div>`;
h(`<div class="top"><button onclick="home()">⬅</button><div class="bar"><i style="width:${(G.n-G.q.length)/G.n*100}%"></i></div><span>💔 ${G.m}</span></div>
<div class="card"><div class="ru">${l.e} ${l.t}</div>
<div class="w">${l.type?"?":"<u>?</u>"}${b}</div><div class="ru">${ru}</div>
<button class="sp" onclick="say('${b}')">🔊</button>${body}<div id="fb"></div></div>`);
if(l.type)$("ans").focus()}

function hint(){const c=G.q[0];$("fb").innerHTML=`<div class="fb" style="background:var(--soft)">💡 Приставка начинается на «${c.x[1][0]}». ${N[c.x[1]]}</div>`}
function pick(p){if(G.a)return;const ok=p===G.q[0].x[1];
document.querySelectorAll(".opts button").forEach(b=>{if(b.dataset.p===G.q[0].x[1])b.classList.add("ok");else if(b.dataset.p===p)b.classList.add("bad")});settle(ok)}
function chk(){if(G.a)return;const c=G.q[0],v=$("ans").value.trim().toLowerCase();if(!v)return;settle(v===c.x[1]+c.x[0])}
function settle(ok){G.a=true;const c=G.q[0],w=c.x[1]+c.x[0];beep(ok);
if(ok)G.q.shift();else{G.m++;G.q.shift();if(!c.r){c.r=1;G.q.push(c)}}
$("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"💖 Верно!":"🙈 Почти!"} <b>${w}</b> — ${c.x[2]}<br><small>${c.x[3]||N[c.x[1]]}</small></div><button class="big" onclick="ask()">Дальше →</button>`;
setTimeout(()=>say(w),250)}

function fin(){const s=G.m<=1?3:G.m<=3?2:1;S.st[G.l]=Math.max(S.st[G.l],s);save();rain(["🎉","💖","⭐","🌸","🎀"],36);beep(true);
const nx=G.l<L.length-1;
h(`<h1>Уровень пройден!</h1><div class="stars">${"★".repeat(s)+"☆".repeat(3-s)}</div>
<p class="sub">Ошибок: ${G.m}. ${s==3?"Просто звезда! 🌟":s==2?"Очень хорошо! 💪":"Пройдено! Попробуй ещё раз за 3 звезды 🎀"}</p>
${nx?`<button class="big" onclick="start(${G.l+1})">Следующий уровень →</button>`:`<button class="big" onclick="report()">🏆 Мой отчёт</button>`}
<button class="big ghost" onclick="start(${G.l})">🔁 Ещё раз</button><button class="big ghost" onclick="home()">🏠 К уровням</button>`)}

function report(){const tot=S.st.reduce((a,b)=>a+b,0),d=new Date().toLocaleDateString("ru-RU");
h(`<div class="rep"><h1>Мой отчёт</h1><div>${S.name||"Ученица"} · ${d}</div>
<table>${L.map((l,i)=>`<tr><td>${l.e} ${i+1}. ${l.t}</td><td>${"★".repeat(S.st[i])+"☆".repeat(3-S.st[i])}</td></tr>`).join("")}</table>
<b>Всего: ${tot} из 15 ★</b><p class="sub">📸 Сделай скриншот и отправь учителю</p></div>
<button class="big ghost" onclick="home()">🏠 К уровням</button>`);if(tot==15)rain(["🏆","💖","🎉"],30)}
home();
</script></body></html>
