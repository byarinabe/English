<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Present or Past? English Game</title>
<style>
:root{--bg:#f6f1e9;--card:#fff;--tx:#23262b;--mut:#6b7078;--pri:#3b6ef5;--ok:#1f9d63;--bad:#d9453d;--bd:#e3dccf;--okb:#e0f5ea;--badb:#fbe5e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191d;--card:#22252b;--tx:#eceef1;--mut:#9aa0a9;--pri:#7c9cff;--ok:#4cc58c;--bad:#ff7d75;--bd:#343842;--okb:#173a2b;--badb:#442221;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17191d;--card:#22252b;--tx:#eceef1;--mut:#9aa0a9;--pri:#7c9cff;--ok:#4cc58c;--bad:#ff7d75;--bd:#343842;--okb:#173a2b;--badb:#442221;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-top:14px}
h1{font-size:28px;margin:6px 0 4px}h2{margin:0 0 6px;font-size:22px}
.mut{color:var(--mut);font-size:15px}.top{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:9px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
button,input{font:inherit}
.btn{display:block;width:100%;padding:13px 16px;margin-top:10px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);cursor:pointer;font-weight:600;text-align:left}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn.main{background:var(--pri);border-color:var(--pri);color:#fff;text-align:center}
.btn.ok{border-color:var(--ok);background:var(--okb)}.btn.bad{border-color:var(--bad);background:var(--badb)}
.btn:disabled{cursor:default}
input[type=text]{width:100%;padding:13px 14px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);margin-top:12px}
input[type=text]:focus{outline:none;border-color:var(--pri)}
.sent{font-size:22px;font-weight:600;margin:6px 0}.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--pri)}
.spk{width:92px;height:92px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:38px;cursor:pointer;display:block;margin:6px auto}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:600}.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}
.fb small{display:block;color:var(--tx);font-weight:400;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:9px 0}
.stars{font-size:34px;text-align:center;margin:8px 0}.big{font-size:46px;font-weight:800;text-align:center;line-height:1}
.mi{font-size:15px;border-top:1px solid var(--bd);padding:7px 0}.mi b{color:var(--ok)}
.two{display:flex;gap:10px}.two .btn{text-align:center}
</style></head><body><main id="app"></main>
<script>
const V={};"be:was/were,beat:beat,become:became,begin:began,break:broke,bring:brought,build:built,burn:burnt/burned,buy:bought,catch:caught,choose:chose,come:came,cost:cost,cut:cut,do:did,draw:drew,drink:drank,drive:drove,eat:ate,fall:fell,feed:fed,feel:felt,fight:fought,find:found,fly:flew,forget:forgot,get:got,give:gave,go:went,grow:grew,hang:hung,have:had,hear:heard,hide:hid,hit:hit,hold:held".split(",").forEach(p=>{const[a,b]=p.split(":");V[a]=b});
const B=`Yesterday I ___ a new phone.|bought|buy,buys|buy
She ___ coffee every morning.|drinks|drink,drank|drink
Last night we ___ pizza.|ate|eat,eats|eat
He ___ to work every day.|drives|drove,drive|drive
They ___ home at six yesterday.|came|come,comes|come
I ___ my homework yesterday.|forgot|forget,forgets|forget
My brother ___ a big family now.|has|had,have|have
We ___ a big dinner last Sunday.|had|have,has|have
The film ___ at eight yesterday.|began|begins,begin|begin
The lesson ___ at nine every day.|begins|began,begin|begin
Tom ___ his arm last year.|broke|breaks,break|break
She ___ her sister to the party yesterday.|brought|brings,bring|bring
They ___ this house in 2010.|built|build,builds|build
I ___ my wallet in the park yesterday.|found|find,finds|find
Birds ___ in the sky every day.|fly|flew,flies|fly
We ___ to Paris last summer.|flew|fly,flies|fly
I ___ happy now.|feel|felt,feels|feel
Yesterday I ___ very tired.|felt|feel,feels|feel
Our cat ___ mice every night.|catches|caught,catch|catch
She ___ a red dress last week.|chose|choose,chooses|choose
He ___ his finger yesterday.|cut|cuts,cutted|cut
Mum ___ the bread every morning.|cuts|cut,cutted|cut
She ___ her homework every day.|does|did,do|do
He ___ a picture yesterday.|drew|draw,draws|draw
I ___ and hurt my knee yesterday.|fell|fall,falls|fall
I ___ the dog this morning.|fed|feed,feeds|feed
The boys ___ at school yesterday.|fought|fight,fights|fight
I ___ up at seven every day.|get|got,gets|get
He ___ me a gift last Monday.|gave|give,gives|give
My son ___ a lot last year.|grew|grow,grows|grow
She ___ her coat on the chair yesterday.|hung|hang,hangs|hang
We ___ a loud noise last night.|heard|hear,hears|hear
The boy ___ behind the door yesterday.|hid|hide,hides|hide
He ___ the bag all day yesterday.|held|hold,holds|hold
Last year I ___ a teacher.|became|become,becomes|become
Our team ___ the other team last Saturday.|beat|beats,beated|beat
I ___ at school yesterday.|was|am,were|be
They ___ happy now.|are|were,is|be
Yesterday I ___ the toast.|burnt|burn,burns|burn
He ___ the ball very hard yesterday.|hit|hits,hitted|hit`.split("\n").map(l=>{const[t,a,o,v]=l.split("|");return{t,a,o:o.split(","),v}});
const LV=[{n:"Listen & Choose",d:"Listen to the sentence. Is it Present or Past?",k:"lc",c:8},{n:"Choose the Word",d:"Pick the correct word for the gap.",k:"ch",c:8},{n:"Verb Machine",d:"Write the Past Simple form of the verb.",k:"vm",c:8},{n:"Write the Verb",d:"Type the correct form of the verb in brackets.",k:"wr",c:8},{n:"Listen & Type",d:"Listen and type the missing word.",k:"lt",c:6}];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),A=$("#app"),TTS="speechSynthesis"in window;
const forms=v=>V[v].split("/"),full=q=>q.t.replace("___",q.a),isPast=q=>forms(q.v).includes(q.a);
const acc=q=>forms(q.v).includes(q.a)?forms(q.v):[q.a];
let S;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function home(){S={name:"",lv:0,res:[],mist:[],t0:0};
A.innerHTML=`<h1>🎮 Present or Past?</h1><p class="mut">English game · Present Simple &amp; Past Simple · 5 levels</p>
<div class="card"><p style="margin-top:0">Hi! Type your name and start.<br><span class="mut">Привет! Введи имя и начинай. В конце будет отчёт: сделай скриншот и отправь учителю.</span></p>
<input type="text" id="nm" placeholder="Your name" maxlength="30" autocomplete="off"><button class="btn main" id="go">Start game</button>
<p class="mut" style="margin-bottom:0">🔊 Turn on the sound for the listening levels.</p></div>`;
$("#go").onclick=()=>{S.name=$("#nm").value.trim()||"Student";S.t0=Date.now();lvl(0)};
$("#nm").onkeydown=e=>{if(e.key=="Enter")$("#go").click()}}
function lvl(n){S.lv=n;const L=LV[n];S.i=0;S.sc=0;
S.qs=L.k=="vm"?sh(Object.keys(V)).slice(0,L.c):sh(B).slice(0,L.c);
A.innerHTML=`<div class="top"><span>Level ${n+1} of 5</span></div><div class="card"><h2>${L.n}</h2><p class="mut">${L.d}</p><button class="btn main" id="go">Let’s go!</button></div>`;
$("#go").onclick=ask}
function ask(){const L=LV[S.lv],q=S.qs[S.i],k=L.k;
let h=`<div class="top"><span>Level ${S.lv+1} · ${L.n}</span><span>${S.i+1}/${S.qs.length}</span></div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="card">`;
if(k=="lc"){h+=`<button class="spk" id="sp" aria-label="Play">🔊</button><p class="mut" style="text-align:center">${TTS?"Tap to listen again":"Sound is not available: "+full(q)}</p><button class="btn" data-v="1">Present — now / every day</button><button class="btn" data-v="0">Past — yesterday / before</button>`}
else if(k=="ch"){h+=`<div class="sent">${q.t.replace("___",'<span class="blank"></span>')}</div>`+sh([q.a,...q.o]).map(o=>`<button class="btn" data-v="${o}">${o}</button>`).join("")}
else if(k=="vm"){h+=`<p class="mut" style="margin:0">Past Simple of:</p><div class="sent" style="font-size:34px">${q}</div><input type="text" id="in" placeholder="Type here" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn main" id="ck">Check</button>`}
else if(k=="wr"){h+=`<div class="sent">${q.t.replace("___",'<span class="blank"></span> ('+q.v+")")}</div><input type="text" id="in" placeholder="Type here" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn main" id="ck">Check</button>`}
else{h+=`<button class="spk" id="sp" aria-label="Play">🔊</button><div class="sent" style="text-align:center">${q.t.replace("___",'<span class="blank"></span>')}</div><input type="text" id="in" placeholder="Missing word" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn main" id="ck">Check</button>`}
A.innerHTML=h+`<div id="fb"></div></div>`;
if($("#sp")){$("#sp").onclick=()=>say(full(q));setTimeout(()=>say(full(q)),250)}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
 const v=b.dataset.v;let ok,right;
 if(k=="lc"){right=isPast(q)?"0":"1";ok=v==right}else{right=q.a;ok=v==right}
 document.querySelectorAll("[data-v]").forEach(x=>{x.disabled=true;if(x.dataset.v==right)x.classList.add("ok")});
 if(!ok)b.classList.add("bad");
 fin(ok,k=="lc"?(isPast(q)?"Past":"Present"):q.a,k=="lc"?(v=="1"?"Present":"Past"):v,q)});
if($("#in")){const inp=$("#in");inp.focus();inp.onkeydown=e=>{if(e.key=="Enter"&&$("#ck"))$("#ck").click()};
 $("#ck").onclick=()=>{const v=inp.value.trim().toLowerCase();if(!v)return;
  const ok=k=="vm"?forms(q).includes(v):acc(q).includes(v);
  inp.disabled=true;$("#ck").remove();fin(ok,k=="vm"?forms(q).join(" / "):acc(q).join(" / "),v,q)}}}
function fin(ok,right,mine,q){const k=LV[S.lv].k;if(ok)S.sc++;else S.mist.push({lv:S.lv+1,q:typeof q=="string"?"Past Simple of "+q:q.t.replace("___","_____"),mine,right});
const sent=typeof q=="string"?"":full(q);
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"✓ Correct!":"✗ Not quite. Correct answer: "+right}${sent?`<small>${sent}</small>`:""}</div><button class="btn main" id="nx">${S.i+1<S.qs.length?"Next":"Finish level"}</button>`;
if(k=="lc"||k=="lt")say(typeof q=="string"?q:full(q));
$("#nx").onclick=()=>{S.i++;if(S.i<S.qs.length)ask();else done()};$("#nx").focus()}
function stars(p){return p>=90?"⭐⭐⭐":p>=60?"⭐⭐":"⭐"}
function done(){const L=LV[S.lv],p=Math.round(S.sc/S.qs.length*100);S.res.push({n:L.n,sc:S.sc,max:S.qs.length,p});
const last=S.lv==LV.length-1;
A.innerHTML=`<div class="card"><h2>Level ${S.lv+1} complete!</h2><div class="stars">${stars(p)}</div><div class="big">${S.sc} / ${S.qs.length}</div><p class="mut" style="text-align:center">${p>=90?"Fantastic!":p>=60?"Good job!":"Keep practising — you can do it!"}</p><button class="btn main" id="nx">${last?"See my report":"Next level"}</button></div>`;
$("#nx").onclick=()=>last?report():lvl(S.lv+1)}
function report(){const ts=S.res.reduce((a,r)=>a+r.sc,0),tm=S.res.reduce((a,r)=>a+r.max,0),p=Math.round(ts/tm*100);
const mins=Math.max(1,Math.round((Date.now()-S.t0)/60000)),dt=new Date().toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
const grade=p>=90?"Excellent! 🏆":p>=75?"Great work! 🎉":p>=60?"Good job! 👍":"Keep practising! 💪";
const m=S.mist.slice(0,6);
A.innerHTML=`<div class="card" style="margin-top:0"><div class="mut">Present or Past? · Game report</div><h2 style="font-size:26px;margin-top:4px">${S.name.replace(/</g,"&lt;")}</h2><div class="mut">${dt} · ${mins} min</div>
<div class="stars">${stars(p)}</div><div class="big">${p}%</div><p style="text-align:center;font-weight:700;margin:6px 0 12px">${grade}<br><span class="mut" style="font-weight:400">${ts} of ${tm} correct</span></p>
${S.res.map((r,i)=>`<div class="row"><span>${i+1}. ${r.n}</span><b>${r.sc}/${r.max} ${stars(r.p)}</b></div><div class="bar" style="margin:0"><i style="width:${r.p}%"></i></div>`).join("")}
${m.length?`<p class="mut" style="margin:14px 0 4px"><b>Review your mistakes:</b></p>`+m.map(x=>`<div class="mi">L${x.lv}: ${x.q}<br>You: ${x.mine} → <b>${x.right}</b></div>`).join("")+(S.mist.length>6?`<div class="mi mut">+ ${S.mist.length-6} more</div>`:""):`<p style="text-align:center;margin-bottom:0">No mistakes — perfect! 🌟</p>`}
</div><p class="mut" style="text-align:center">📸 Take a screenshot of this page and send it to your teacher.</p>
<div class="two"><button class="btn" id="cp">Copy text</button><button class="btn main" id="ag">Play again</button></div>`;
$("#ag").onclick=home;
$("#cp").onclick=()=>{const t=`Present or Past? — ${S.name}\n${dt}\nTotal: ${ts}/${tm} (${p}%)\n`+S.res.map((r,i)=>`L${i+1} ${r.n}: ${r.sc}/${r.max}`).join("\n");
 try{navigator.clipboard.writeText(t).then(()=>{$("#cp").textContent="Copied ✓"},()=>{$("#cp").textContent="Not available"})}catch(e){$("#cp").textContent="Not available"}}}
home();
</script></body></html>
