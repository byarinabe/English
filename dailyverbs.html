<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Слова: глаголы дня</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2233;--mut:#667085;--pri:#4f46e5;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--bd:#dfe3ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#eef0f6;--mut:#9aa3b8;--pri:#818cf8;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#5b1a1a;--bd:#2d3350;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#eef0f6;--mut:#9aa3b8;--pri:#818cf8;--ok:#4ade80;--okbg:#14532d;--bad:#f87171;--badbg:#5b1a1a;--bd:#2d3350;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:23px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px;font-size:16px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:12px}
.q{font-size:24px;margin:4px 0 16px}.q b{font-size:30px;color:var(--pri)}
input{font:inherit;font-size:22px;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);margin-bottom:10px}
input:focus{outline:none;border-color:var(--pri)}
button{font:inherit;cursor:pointer;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px 16px}
button:hover:not(:disabled){border-color:var(--pri)}
.main{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts button{font-size:19px;padding:14px 8px}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;opacity:.7}
.msg{min-height:26px;margin-top:10px;font-size:16px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc{text-align:left;padding:12px}.fc b{font-size:20px}.fc .ru{margin-top:4px;color:var(--mut);font-size:17px;min-height:26px}
.fc.open{border-color:var(--ok)}.fc.open .ru{color:var(--tx)}
.say{cursor:pointer;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:17px}td{padding:8px 4px;border-bottom:1px solid var(--bd);vertical-align:top}td:first-child{color:var(--mut);width:46%}
.code{font:700 22px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;margin-top:12px;color:var(--pri)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const W=[["wake up","просыпаться"],["get up","вставать"],["eat","есть"],["drink","пить"],["cook","готовить"],["sleep","спать"],["start","начинать"],["finish","заканчивать"],["come","приходить"],["live","жить"],["work","работать"],["have","иметь"],["like","любить, нравиться"],["take","брать"],["go","идти, ехать"],["play","играть"],["study","учиться, изучать"],["read","читать"],["watch","смотреть"],["walk","гулять"]];
const $=s=>document.querySelector(s),app=$("#app");
const S={t0:0,A:null,B:null,miss:new Set()};
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const head=t=>'<h1>📘 Слова: глаголы дня</h1><p class="sub">'+t+'</p>';
function intro(){
app.innerHTML=head("Выучи 20 глаголов и сдай тест")+'<div class="box"><p><b>Шаг 1.</b> Карточки: открой все и запомни перевод.<br><b>Шаг 2.</b> Тест A: выбери перевод.<br><b>Шаг 3.</b> Тест B: напиши слово по-английски.<br><b>Шаг 4.</b> Получишь отчёт: сделай скриншот и отправь преподавателю.</p><p class="sub">Слова, где ошибся, вернутся в конце теста. Тест закончится, когда все слова будут правильными.</p><div class="row"><button class="main" id="go">Начать ▶</button></div></div>';
$("#go").onclick=study}
function study(){
const op=new Set();
const draw=()=>{
app.innerHTML=head("Шаг 1 · Нажми на каждую карточку. 🔊 произнесёт слово.")+'<div class="grid">'+W.map((w,k)=>'<button class="fc'+(op.has(k)?' open':'')+'" data-k="'+k+'"><b>'+w[0]+'</b> <span class="say" data-say="'+w[0]+'">🔊</span><div class="ru">'+(op.has(k)?w[1]:'?')+'</div></button>').join("")+'</div><div class="msg">Открыто: '+op.size+' из '+W.length+'</div>'+(op.size===W.length?'<div class="row"><button class="main" id="go">Начать тест ▶</button></div>':'');
document.querySelectorAll(".fc").forEach(b=>b.onclick=e=>{if(e.target.dataset.say){speak(e.target.dataset.say);return}op.add(+b.dataset.k);draw()});
const g=$("#go");if(g)g.onclick=()=>{S.t0=Date.now();test("A")}};
draw()}
function test(mode){
const q=shuf(W.map((_,k)=>k)),N=W.length,seen={};let first=0,att=0;
const next=()=>{
if(!q.length){S[mode]={first,att};mode==="A"?test("B"):report();return}
const k=q[0],w=W[k],left=new Set(q).size;
let h=head(mode==="A"?"Шаг 2 · Тест A: выбери перевод":"Шаг 3 · Тест B: напиши слово по-английски")+'<div class="bar"><i style="width:'+((N-left)/N*100)+'%"></i></div><div class="box">';
const miss=()=>{if(!seen[k]){seen[k]=1;S.miss.add(w[0]);q.push(k)}};
if(mode==="A"){
const opts=shuf([k,...shuf(W.map((_,j)=>j).filter(j=>j!==k)).slice(0,3)]);
h+='<div class="q"><b>'+w[0]+'</b> <span class="say" id="sy">🔊</span></div><div class="opts">'+opts.map(j=>'<button data-j="'+j+'">'+W[j][1]+'</button>').join("")+'</div><div class="msg" id="m"></div></div>';
app.innerHTML=h;$("#sy").onclick=()=>speak(w[0]);
app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{att++;
if(+b.dataset.j===k){b.classList.add("ok");app.querySelectorAll(".opts button").forEach(x=>x.disabled=true);if(!seen[k])first++;q.shift();$("#m").textContent="✅ Верно";setTimeout(next,600)}
else{b.classList.add("bad");b.disabled=true;$("#m").textContent="Не то. Попробуй ещё.";miss()}})}
else{
h+='<div class="q">Как по-английски: <b>'+w[1]+'</b>?</div><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Напечатай слово"><div class="row"><button class="main" id="ck">Проверить</button></div><div class="msg" id="m"></div></div>';
app.innerHTML=h;const inp=$("#in");inp.focus();let er=0;
const ck=()=>{const v=inp.value.trim().toLowerCase().replace(/\s+/g," ");if(!v)return;att++;
if(v===w[0]){if(!seen[k])first++;q.shift();inp.disabled=true;$("#m").textContent="✅ Верно";setTimeout(next,600)}
else{er++;miss();$("#m").textContent=er>=3?"Ответ: "+w[0]+". Впиши его.":"Не то. Подсказка: первая буква «"+w[0][0]+"», букв: "+w[0].replace(/ /g,"").length;inp.value="";inp.focus()}};
$("#ck").onclick=ck;inp.onkeydown=e=>{if(e.key==="Enter")ck()}}};
next()}
function report(){
const sec=Math.round((Date.now()-S.t0)/1000),miss=[...S.miss],N=W.length;
const rows=[["Тест A: слово → перевод","с первой попытки "+S.A.first+" из "+N],["Тест B: перевод → слово","с первой попытки "+S.B.first+" из "+N],["Всего попыток",String(S.A.att+S.B.att)],["Время теста",Math.floor(sec/60)+" мин "+(sec%60)+" с"],["Слова с ошибками",miss.length?miss.join(", "):"нет"],["Дата и время",new Date().toLocaleString("ru-RU")]];
let hs=0;for(const c of rows.map(r=>r.join(":")).join("|"))hs=(hs*31+c.charCodeAt(0))>>>0;
const code=hs.toString(36).toUpperCase().padStart(6,"0").slice(-6);
app.innerHTML=head("Тест пройден! Сделай скриншот этого экрана")+'<div class="box"><h1>✅ Все 20 слов сданы</h1><table>'+rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join("")+'</table><div class="code">Код: '+code+'</div></div><p class="sub">Отправь скриншот преподавателю.</p>'}
intro();
</script>
</body>
</html>
