<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opinion Quest: домашнее задание</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1d1a2e;--mute:#6b6785;--acc:#6c47ff;--ok:#16a34a;--bad:#dc2626;--line:#ddd8fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#15122b;--card:#201c3d;--ink:#f1eeff;--mute:#a9a4c8;--acc:#9b83ff;--ok:#4ade80;--bad:#f87171;--line:#38335f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#15122b;--card:#201c3d;--ink:#f1eeff;--mute:#a9a4c8;--acc:#9b83ff;--ok:#4ade80;--bad:#f87171;--line:#38335f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.hud{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:700}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;margin-bottom:12px}
.center{text-align:center}
h1,h2{margin:0 0 8px}
p{margin:8px 0}
.lab{color:var(--mute);font-size:14px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.prompt{font-size:22px;font-weight:700;margin-bottom:12px}
.bubble{font-size:21px;font-weight:700;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.big{font-size:34px;font-weight:800;margin:4px 0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok,.zone.ok,.inp.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.bad,.zone.bad,.inp.bad{border-color:var(--bad);background:rgba(220,38,38,.12)}
.opt:disabled{color:var(--ink);cursor:default}
.zone{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--acc);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
.inp{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.say{border:0;background:transparent;font-size:22px;cursor:pointer;padding:0 4px}
.fb{min-height:24px;font-weight:700;margin-top:8px}
.hp{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 14px}
.hp i{display:block;height:100%;background:var(--bad);transition:width .4s}
.boss{font-size:20px;font-weight:800}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600}
.mi{font-size:15px;margin:6px 0}
.mi b{color:var(--bad)}
.foot{color:var(--mute);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var $=function(s){return document.querySelector(s)};
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t}return a}
function each(box,f){[].forEach.call(box.children,f)}

var P=[["Did you enjoy it?","Тебе понравилось?"],["How about you?","А как насчёт тебя?"],["So what did you think of it?","И что ты об этом думаешь?"],["What do you think?","Что ты думаешь?"],["I really liked it.","Мне это очень понравилось."],["Yeah, it was a good concert.","Да, это был хороший концерт."],["I thought the singer was great.","Я думал(а), что певец был отличным."],["I thought they played quite well, but their songs were boring.","Я думал(а), они играли довольно хорошо, но их песни были скучными."],["I didn’t like the first band very much.","Мне не очень понравилась первая группа."],["I thought they were terrible.","Я думал(а), они были ужасны."],["I didn’t like the first band at all.","Мне совсем не понравилась первая группа."],["Me too.","Я тоже."],["Me neither.","Я тоже нет."]];
var PAIR=[3,0,3,2,6,6,5,9,10,7,8,12,11];
function dist(i,f){var r=sh(P.map(function(_,k){return k}).filter(function(k){return k!==i&&k!==PAIR[i]}));return[PAIR[i],r[0],r[1]].map(function(k){return P[k][f]})}
var G=[
["Did you ___ it?","enjoy",["enjoyed","enjoying","enjoys"]],
["___ about you?","How",["What","Why","Who"]],
["So what did you ___ of it?","think",["thought","thinking","thinks"]],
["I thought the singer ___ great.","was",["were","be","been"]],
["I didn’t like the first band at ___.","all",["much","very","some"]],
["“I didn’t like it.” — “Me ___.”","neither",["too","also","not"]],
["“I really liked it.” — “Me ___.”","too",["neither","not","no"]],
["I thought they played quite well, but their songs were ___.","boring",["bored","bore","bores"]]
];
var SIT=[
["Друг спрашивает, понравился ли тебе концерт. Он тебе очень понравился.","I really liked it.",["I thought they were terrible.","Me neither.","How about you?"]],
["Друг говорит: «I didn’t like the first band.» Ты с ним согласен(на).","Me neither.",["Me too.","Did you enjoy it?","What do you think?"]],
["Ты хочешь узнать мнение друга о фильме.","What do you think?",["Me too.","I really liked it.","Me neither."]],
["Друг говорит: «I really liked it.» Тебе тоже понравилось.","Me too.",["Me neither.","I thought they were terrible.","Did you enjoy it?"]],
["Группа играла неплохо, но песни были скучными. Как это сказать?","I thought they played quite well, but their songs were boring.",["I thought they were terrible.","I thought the singer was great.","I really liked it."]]
];
var BOSS=[
["Hey! Did you enjoy the concert?","Yeah, it was a good concert.",["Me neither.","How about you?"]],
["I thought the singer was great.","Me too.",["Me neither.","Did you enjoy it?"]],
["I didn’t like the first band at all.","Me neither.",["Me too.","How about you?"]],
["Hmm, honestly it was a mixed night. What do you think?","I thought they played quite well, but their songs were boring.",["Me neither.","Did you enjoy it?"]],
["So what did you think of it?","I thought they were terrible.",["Me too.","Did you enjoy it?"]]
];
var LV=[
{t:"1. Слушай и узнавай",d:"Прочитай или послушай фразу (кнопка 🔊) и выбери перевод. 1 очко.",p:1,f:function(){return P.map(function(q,i){return{t:"c",lab:"Что это значит?",prompt:q[0],say:1,ans:q[1],opts:dist(i,1)}})}},
{t:"2. Скажи по-английски",d:"Выбери правильную английскую фразу. 1 очко.",p:1,f:function(){return P.map(function(q,i){return{t:"c",lab:"Как сказать по-английски?",prompt:q[1],ans:q[0],opts:dist(i,0)}})}},
{t:"3. Вставь слово",d:"Выбери пропущенное слово. 2 очка.",p:2,f:function(){return G.map(function(g){return{t:"c",lab:"Вставь пропущенное слово",prompt:g[0],ans:g[1],opts:g[2]}})}},
{t:"4. Собери фразу",d:"Собери фразу из слов по порядку. 2 очка.",p:2,f:function(){return[6,10,2,5,8,9].map(function(i){return{t:"b",prompt:P[i][1],ans:P[i][0]}})}},
{t:"5. Ситуации",d:"Выбери фразу, которая подходит к ситуации. 3 очка.",p:3,f:function(){return SIT.map(function(s){return{t:"c",lab:"Ситуация",prompt:s[0],ans:s[1],opts:s[2]}})}}
];

var S,LOG;
function reset(){S={score:0,streak:0,lv:0,hearts:3,boss:5,bt:1,be:0,ans:0,t0:Date.now(),n:0,d:0,name:""};LOG=[]}
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim()}
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

function hud(){var d=mk("div","hud");d.append(mk("span","pill","⭐ "+S.score),mk("span","pill","🔥 "+S.streak));
 if(S.lv===5)d.append(mk("span","pill","❤️".repeat(S.hearts)+"🖤".repeat(3-S.hearts)));
 else if(S.lv<5&&S.n)d.append(mk("span","pill","✔ "+S.d+"/"+S.n));return d}
function app(){var a=$("#app");a.replaceChildren.apply(a,[hud()].concat([].slice.call(arguments)));window.scrollTo(0,0)}
function refreshHud(){$(".hud").replaceWith(hud())}
function gain(p){S.streak++;var g=p+(S.streak>=3?1:0);S.score+=g;return g}
function nextBtn(f,l){var b=mk("button","btn",l||"Дальше →");b.onclick=f;return b}

function start(){var n=S?S.name:"";reset();var c=mk("div","card center");
 c.append(mk("h1",0,"📚 Opinion Quest: домашка"),mk("p",0,"5 разделов и босс. Ошибочные задания возвращаются, чтобы ты их закрепил(а). В конце появится отчёт: сделай его скриншот и отправь учителю."),mk("p","lab","Как тебя зовут?"));
 var inp=mk("input","inp");inp.type="text";inp.placeholder="Имя";inp.value=n;
 var b=mk("button","btn","Начать");
 b.onclick=function(){if(!inp.value.trim()){inp.focus();return}S.name=inp.value.trim();S.t0=Date.now();intro()};
 c.append(inp,document.createElement("br"),b);app(c)}

function intro(){var c=mk("div","card center"),b;
 if(S.lv===5){S.hearts=3;S.boss=5;S.n=0;
  c.append(mk("h2",0,"👹 Финал · Критик Боб"),mk("p",0,"Отвечай на реплики босса. Верный ответ отнимает у него жизнь, ошибка стоит сердечка. Если сердечки закончатся, бой начнётся заново. Отчёт появится после победы."));
  b=mk("button","btn","В бой!");b.onclick=bossAsk}
 else{var v=LV[S.lv];S.q=sh(v.f()).map(function(x){return{x:x,w:[]}});S.n=S.q.length;S.d=0;
  c.append(mk("h2",0,"Уровень "+v.t),mk("p",0,v.d),mk("p","lab","Заданий: "+S.n));
  b=mk("button","btn","Поехали!");b.onclick=ask}
 c.append(b);app(c)}

function ask(){if(!S.q.length){S.lv++;intro();return}
 var r=S.q[0],t=r.x.t;(t==="c"?choice:t==="b"?build:type)(r)}

function done(r,ok,pick,fb,c){var v=LV[S.lv],first=!r.w.length,fin=false,g;S.ans++;
 if(ok){if(first)g=gain(v.p);else{S.streak=0;g=1;S.score+=1}
  fb.textContent="✅ Верно! +"+g+" оч."+(first&&S.streak>=3?" 🔥 бонус за серию":"");fin=true}
 else{S.streak=0;r.w.push(pick);
  if(r.w.length<2){S.q.push(S.q.shift());fb.textContent="❌ Не то. Это задание вернётся ещё раз."}
  else{fb.textContent="❌ Правильный ответ: "+r.x.ans;fin=true}}
 if(fin){LOG.push({lv:S.lv,p:r.x.prompt,a:r.x.ans,w:r.w,ok:ok});S.q.shift();S.d++}
 refreshHud();c.append(nextBtn(ask))}

function choice(r){var x=r.x,c=mk("div","card"),p=mk("div","prompt",x.prompt);c.append(mk("div","lab",x.lab));
 if(x.say&&window.speechSynthesis){var s=mk("button","say","🔊");s.onclick=function(){speak(x.prompt)};p.append(" ",s)}
 c.append(p);var box=mk("div"),fb=mk("div","fb"),lock=false;
 sh([x.ans].concat(x.opts)).forEach(function(t){var b=mk("button","opt",t);
  b.onclick=function(){if(lock)return;lock=true;var ok=t===x.ans;b.classList.add(ok?"ok":"bad");each(box,function(y){y.disabled=true});done(r,ok,t,fb,c)};
  box.append(b)});
 c.append(box,fb);app(c)}

function build(r){var x=r.x,pool=sh(x.ans.split(" ").map(function(w,i){return{w:w,i:i}})),ans=[],fin=false;
 var c=mk("div","card"),zone=mk("div","zone"),pl=mk("div","pool"),fb=mk("div","fb"),chk=mk("button","btn","Проверить");
 c.append(mk("div","lab","Собери фразу"),mk("div","prompt",x.prompt));
 function chip(t,f){var b=mk("button","chip",t.w);b.onclick=function(){if(!fin)f()};return b}
 function draw(){
  zone.replaceChildren.apply(zone,ans.map(function(t){return chip(t,function(){ans=ans.filter(function(y){return y!==t});pool.push(t);draw()})}));
  pl.replaceChildren.apply(pl,pool.map(function(t){return chip(t,function(){pool=pool.filter(function(y){return y!==t});ans.push(t);draw()})}));
  chk.disabled=pool.length>0}
 chk.onclick=function(){fin=true;var a=ans.map(function(t){return t.w}).join(" "),ok=a===x.ans;zone.classList.add(ok?"ok":"bad");chk.remove();done(r,ok,a,fb,c)};
 c.append(zone,pl,fb,chk);app(c);draw()}

function type(r){var x=r.x,c=mk("div","card"),inp=mk("input","inp"),fb=mk("div","fb"),chk=mk("button","btn","Проверить");
 c.append(mk("div","lab","Напиши по-английски"),mk("div","prompt",x.prompt));
 inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;inp.placeholder="Твой ответ…";
 chk.onclick=function(){if(!inp.value.trim())return;var ok=norm(inp.value)===norm(x.ans);inp.disabled=true;inp.classList.add(ok?"ok":"bad");chk.remove();done(r,ok,inp.value.trim(),fb,c)};
 inp.onkeydown=function(e){if(e.key==="Enter"&&chk.parentNode)chk.onclick()};
 c.append(inp,chk,fb);app(c);inp.focus()}

function bossAsk(){var q=BOSS[5-S.boss],c=mk("div","card"),hp=mk("div","hp"),bar=mk("i");
 bar.style.width=(S.boss/5*100)+"%";hp.append(bar);
 c.append(mk("div","boss","👹 Критик Боб"),hp,mk("div","lab","Босс говорит:"),mk("div","bubble",q[0]));
 var box=mk("div"),fb=mk("div","fb"),lock=false;
 sh([q[1]].concat(q[2])).forEach(function(t){var b=mk("button","opt",t);
  b.onclick=function(){if(lock)return;S.ans++;
   if(t===q[1]){lock=true;b.classList.add("ok");S.boss--;bar.style.width=(S.boss/5*100)+"%";
    fb.textContent="✅ Попал! +"+gain(5)+" оч.";each(box,function(y){y.disabled=true});
    c.append(nextBtn(function(){if(S.boss<=0)finish();else bossAsk()},S.boss<=0?"Победа! Показать отчёт →":null))}
   else{b.classList.add("bad");b.disabled=true;S.streak=0;S.be++;S.hearts--;LOG.push({lv:5,p:q[0],a:q[1],w:[t],ok:false});
    if(S.hearts<=0){lock=true;each(box,function(y){y.disabled=true});fb.textContent="💀 Сердечки закончились. Бой начнётся заново.";
     c.append(nextBtn(function(){S.bt++;S.hearts=3;S.boss=5;bossAsk()},"Реванш →"))}
    else fb.textContent="❌ Минус сердечко! Попробуй другой ответ."}
   refreshHud()};
  box.append(b)});
 c.append(box,fb);app(c)}

function finish(){S.lv=7;S.n=0;
 var el=Math.round((Date.now()-S.t0)/1000),tot=0,fst=0,td=function(t){return mk("td",0,t)};
 var tb=mk("table"),hr=mk("tr");["Раздел","Задания","С 1-й попытки","Ошибок"].forEach(function(h){hr.append(mk("th",0,h))});tb.append(hr);
 LV.forEach(function(v,k){var it=LOG.filter(function(e){return e.lv===k}),f=it.filter(function(e){return!e.w.length}).length,
  er=it.reduce(function(a,e){return a+e.w.length},0),pl=v.f().length,tr=mk("tr");
  tot+=it.length;fst+=f;
  tr.append(td(v.t),td((it.length>=pl?"✅ ":"⚠️ ")+it.length+"/"+pl),td(f+" из "+it.length),td(er));tb.append(tr)});
 var br=mk("tr");br.append(td("6. Босс"),td("✅ побеждён"),td("попыток: "+S.bt),td(S.be));tb.append(br);
 var mis=LOG.filter(function(e){return e.w.length}),c=mk("div","card center"),rep=mk("div");
 var pct=tot?Math.round(fst/tot*100):0,id=Date.now().toString(36).slice(-5).toUpperCase();
 rep.append(mk("h2",0,"📋 Отчёт о домашнем задании"),mk("div","lab","Opinion Quest · фразы для выражения мнения"),
  mk("p","big",S.name),mk("div","lab",new Date().toLocaleString("ru-RU",{dateStyle:"short",timeStyle:"short"})+" · время: "+Math.floor(el/60)+" мин "+el%60+" с · ответов: "+S.ans),
  mk("p","big","⭐ "+S.score+" · "+pct+"%"),mk("div","lab","очки · верно с первой попытки"));
 var sc=mk("div","scroll");sc.append(tb);rep.append(sc);
 if(mis.length){rep.append(mk("div","lab","Над чем стоит поработать"));
  mis.slice(0,6).forEach(function(e){var m=mk("div","mi");m.style.textAlign="left";m.append(mk("span",0,e.p+" → "),mk("b",0,e.w[0]),mk("span",0," · верно: "+e.a));rep.append(m)});
  if(mis.length>6)rep.append(mk("div","mi","…и ещё ошибок: "+(mis.length-6)))}
 else rep.append(mk("p",0,"🏆 Без единой ошибки!"));
 rep.append(mk("div","foot","Отчёт № "+id+" · все разделы и босс пройдены ✅"));
 c.append(rep);app(c,mk("p","foot center","Сделай скриншот этого экрана и отправь учителю."))}

reset();start();
</script>
</body>
</html>
